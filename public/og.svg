<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#007cf0"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <text x="80" y="120" font-family="Geist, Helvetica, Arial, sans-serif" font-size="34" fill="#a1a1aa" letter-spacing="3">GOVSTATUS NEPAL</text>

  <text x="80" y="320" font-family="Geist, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#ffffff">Is the government</text>
  <text x="80" y="410" font-family="Geist, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="url(#accent)">online?</text>

  <text x="80" y="480" font-family="Geist, Helvetica, Arial, sans-serif" font-size="30" fill="#a1a1aa">Real-time uptime for 90+ Nepal government portals</text>

  <!-- status dots -->
  <circle cx="92" cy="545" r="10" fill="#10b981"/>
  <text x="112" y="551" font-family="Geist, Helvetica, Arial, sans-serif" font-size="24" fill="#a1a1aa">operational</text>
  <circle cx="310" cy="545" r="10" fill="#f59e0b"/>
  <text x="330" y="551" font-family="Geist, Helvetica, Arial, sans-serif" font-size="24" fill="#a1a1aa">degraded</text>
  <circle cx="500" cy="545" r="10" fill="#f43f5e"/>
  <text x="520" y="551" font-family="Geist, Helvetica, Arial, sans-serif" font-size="24" fill="#a1a1aa">down</text>

  <text x="80" y="600" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#71717a">govstatusnepal.techyatraa.com</text>
