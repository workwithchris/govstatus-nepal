name: Probe

# Probes all services and persists hourly aggregates to D1. Triggered externally
# every 5 minutes (cron-job.org -> workflow_dispatch API); GitHub's own schedule
# is unreliable and kept only as a fallback.
#
# The catalog is sharded across parallel runners (PROBE_SHARD/PROBE_SHARDS) so a
# full pass finishes in ~2 min instead of ~6. D1 writes are per-service upserts,
# so shards never conflict. NOTE: runners are foreign (Azure) IPs — .np WAFs may
# mark some healthy portals degraded/down. The accurate vantage is the Nepal-IP
# machine (probe/run-probe.sh).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    name: Probe shard ${{ matrix.shard }}/4 → D1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Per-shard group so the matrix jobs run in parallel (a shared group would
    # serialize them). cancel-in-progress stays off to let active probes finish.
    concurrency:
      group: probe-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Probe and persist to D1
        run: node probe/nepal-probe.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROBE_SHARD: ${{ matrix.shard }}
          PROBE_SHARDS: "4"
          # Foreign (Azure) vantage: write to status_checks_foreign only — never
          # service_meta or alerts — so Nepal-vantage data is never degraded.
          FOREIGN_VANTAGE: "true"
          VANTAGE_NAME: foreign
          # Intentionally unset: ALERT_WEBHOOK_URL — alerts stay owned by the
          # Nepal-IP probe so transitions never double-send from both writers.
